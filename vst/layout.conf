# NAM VST skin -- SYNTHWAVE theme (neon magenta/cyan on near-black).
# Model/Cab IR are list/stepper browsers: their option lists are read from the filesystem at load,
# not automatable knobs. MPC Key 37 has 4 physical Q-Links and Q-Link sub-pages don't cycle on this
# hardware, so it's ONE Q-Link bank per TAB -- each tab is <=4 controls + a single qlinks line.
# The 8 amp/tone knobs split 3+3 into two banks of 4, so each gate half rides with a full bank:
# GATE THRESH sits with the levels (AMP), GATE REL with the tone stack (TONE).
# hide_qlink_bounds: with one qlinks bank per tab the native Q-Link zone outline (orange box + "Q"
# badge) carries no information. This flag hides it on the page components; skin_post.py's
# hide_qlink_bounds() covers the nested components and zone rectangles.
style=td3
hide_qlink_bounds=1
theme_bg=15101f
theme_box=1e1533
theme_ink=f4ecff
theme_ink_dim=9a86c8
theme_ink_faint=3a2a5c
theme_accent=ff2e88
theme_accent_hi=24e0ff
theme_seg_active=ff2e88
theme_seg_inactive=2a2045
theme_seg_active_tx=15101f
theme_lcd=0e0a18
theme_line=46306a
theme_btn_bg=ff2e88
theme_btn_text=15101f
theme_display_ink=24e0ff
theme_panel=2a1f47
theme_knob_face=241a3d
theme_knob_ring=ff2e88
theme_knob_dot=24e0ff
theme_tab_on=ff2e88
theme_tab_on_tx=15101f
theme_chrome_ink=f4ecff
theme_bar=2a2045

[tab BROWSE]
# Rows are the plugin's view (nam_vst.cpp build_view): pack folders ("+ Name (N)"), loose models,
# and "< All models" inside a pack. rows=6 = SLOTS_PER_PAGE. The PAGE/button row (cy=668) matches
# the TONE3000 tab's. FAVORITE/DELETE act on the loaded model; DELETE is two-tap (the detail line
# asks for confirmation).
frame x=40 y=112 w=1200 h=596 title="MODELS"
enum_h cx=640 cy=180 sw=200 label="" key=browse_filter options="ALL,FAVORITES,RECENT"
list x=64 y=216 w=1152 h=340 cols=1 rows=6 th=50 gap=8 key=slot
readout cx=640 cy=588 w=1152 h=36 key=browse_detail
stepper cx=250 cy=668 w=360 h=52 label="PAGE" key=model_page
button cx=760 cy=668 label="FAVORITE" key=browse_fav
button cx=1040 cy=668 label="DELETE" key=browse_delete
# Knob-safe controls only (turning a Q-Link must never delete or favorite). PAGE on all four: a
# bank mixing keys shows the orange hint box.
qlinks "BROWSE" = model_page,model_page,model_page,model_page

[tab AMP]
frame x=40 y=112 w=1200 h=170 title="AMP MODEL"
stepper cx=640 cy=188 w=1080 h=72 label="" key=model
frame x=40 y=306 w=1200 h=360 title="LEVELS / GATE"
knob cx=245 cy=470 r=60 label="IN GAIN" key=in_gain
knob cx=525 cy=470 r=60 label="OUT GAIN" key=out_gain
knob cx=805 cy=470 r=60 label="GATE THRESH" key=gate_thresh
enum_h cx=1085 cy=470 sw=108 label="QUALITY" key=quality options="LITE,FULL"
qlinks "AMP" = model,in_gain,out_gain,gate_thresh

[tab TONE]
frame x=40 y=112 w=1200 h=320 title="TONE / GATE"
knob cx=245 cy=272 r=60 label="BASS" key=bass
knob cx=525 cy=272 r=60 label="MID" key=mid
knob cx=805 cy=272 r=60 label="TREBLE" key=treble
knob cx=1085 cy=272 r=60 label="GATE REL" key=gate_release
qlinks "TONE" = bass,mid,treble,gate_release

# One frame, like the PITCH/DELAY/REVERB tabs: the on/off toggle and the IR browser stack inside
# the CABINET group, whose title is the only caption.
[tab CAB]
frame x=40 y=112 w=1200 h=320 title="CABINET"
enum_h cx=640 cy=205 sw=108 label="" key=cab_on options="OFF,ON"
stepper cx=640 cy=330 w=1080 h=72 label="" key=cab_ir
qlinks "CAB" = cab_on,cab_ir

[tab PITCH]
frame x=40 y=112 w=1200 h=320 title="PITCH SHIFT"
enum_h cx=320 cy=272 sw=108 label="PITCH" key=pitch_on options="OFF,ON"
knob cx=640 cy=272 r=60 label="SEMITONES" key=pitch_semi
knob cx=960 cy=272 r=60 label="MIX" key=pitch_mix
qlinks "PITCH" = pitch_on,pitch_semi,pitch_mix

[tab DELAY]
frame x=40 y=112 w=1200 h=320 title="DELAY"
knob cx=320 cy=272 r=60 label="TIME" key=delay_time
knob cx=640 cy=272 r=60 label="FEEDBACK" key=delay_fb
knob cx=960 cy=272 r=60 label="MIX" key=delay_mix
qlinks "DELAY" = delay_time,delay_fb,delay_mix

[tab REVERB]
frame x=40 y=112 w=1200 h=320 title="REVERB"
knob cx=480 cy=270 r=72 label="SIZE" key=reverb_size
knob cx=800 cy=270 r=72 label="MIX" key=reverb_mix
qlinks "REVERB" = reverb_size,reverb_mix

[tab TONE3000]
# Mirrors BROWSE's list/stepper pattern; results come from t3k.cpp's worker, one API page per
# request. t3k_status doubles as the LAN login URL when signed out and a downloading/error
# indicator when signed in.
frame x=40 y=100 w=1200 h=192 title="TONE3000"
# No widget on this tab carries a caption: a caption sits ~22px above its widget and would overlap
# the frame title or the row above. The segmented filters share one row (SORT | ARCH | QUALITY; the
# segment names identify them) and GEAR / MAKE are steppers whose value text names the axis
# ("Gear: Amp", nam_vst.cpp). The stepper auto-binds
# <key>_prev/_next. ARCH defaults to MPC (A2 + lite/feather/nano), the captures that run on the
# RK3288; the API's own default (no architecture) returns A1+custom, which are too heavy here.
readout cx=640 cy=162 w=1152 h=30 key=t3k_status
enum_h cx=298 cy=206 sw=92 label="" key=t3k_sort    options="TREND,NEW,DL,FAV"
enum_h cx=656 cy=206 sw=76 label="" key=t3k_arch    options="MPC,A2,STD"
enum_h cx=998 cy=206 sw=84 label="" key=t3k_quality options="ANY,CAL,VER,BOTH"
stepper cx=346 cy=256 w=560 h=44 label="" key=t3k_gear
stepper cx=934 cy=256 w=560 h=44 label="" key=t3k_make
frame x=40 y=302 w=1200 h=406 title="RESULTS"
# rows=5 (T3K_ROWS in nam_vst.cpp). The PAGE/button row (cy=668) matches BROWSE's.
list x=64 y=352 w=1152 h=232 cols=1 rows=5 th=40 gap=8 key=t3k_slot
readout cx=640 cy=606 w=1152 h=30 key=t3k_detail
stepper cx=250 cy=668 w=360 h=48 label="PAGE" key=t3k_page
button cx=760 cy=668 label="DOWNLOAD" key=t3k_confirm
button cx=1040 cy=668 label="CANCEL" key=t3k_cancel
# One Q-Link group: the label must match the tab name, and a second qlinks line would render as an
# extra tab. The four filter axes get the physical knobs; page/download/cancel stay on-screen.
qlinks "TONE3000" = t3k_sort,t3k_arch,t3k_gear,t3k_make
