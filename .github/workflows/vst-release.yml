# Build Neural Amp Modeler into a DRAFT release (nam-vst-v<version>) with mpc-vst-plugins' shared
# workflow: Actions -> "VST release (draft)" -> Run workflow. Then install that draft's zip on a
# device, smoke-test it, and publish the draft (see mpc-vst-plugins docs/RELEASING.md).
# dry_run builds the zip and skin previews as run artifacts only.
name: VST release (draft)

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version, e.g. 1.1.0
        required: true
      dry_run:
        description: Build only (zip + skin previews as run artifacts), no draft release
        type: boolean
        default: false

jobs:
  neural-amp-modeler:
    uses: sd88me/mpc-vst-plugins/.github/workflows/vst-release.yml@39660f2b41c0a6d6e9f8c1f0e19378533d9bbc2f
    permissions:
      contents: write
    with:
      tag: nam-vst-v${{ inputs.version }}
      version: ${{ inputs.version }}
      tools_ref: 39660f2b41c0a6d6e9f8c1f0e19378533d9bbc2f
      vst_dir: vst
      build: vst/release_build.sh
      about: Neural Amp Modeler captures as an MPC insert effect, with cab IR, tone, gate, pitch, delay, reverb and an on-device TONE3000 downloader.
      dry_run: ${{ inputs.dry_run }}
