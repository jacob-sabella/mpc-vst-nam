name: Secret Scan

# TruffleHog over the full git history on every push and pull request, and weekly so newly added
# detectors are applied to existing history. Any finding fails the job, verified or not; the
# same scan runs locally with scripts/secret-scan.sh.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

concurrency:
  group: secrets-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  trufflehog:
    runs-on: ubuntu-latest
    name: TruffleHog
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Scan git history
        run: scripts/secret-scan.sh
