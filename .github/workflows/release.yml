# Build NAM for MPC OS and attach the zips to a DRAFT release, with mpc-vst-plugins' reusable workflow
# (its docs/RELEASING.md, "Releasing from CI"). Run it from the Actions tab with a version; the tag is nam-vst-v<version>.
# Releases up to 1.0.10 were tagged v<version> by an older, tag-driven workflow; those tags stay as they are.
# mpc-vst-plugins is pinned to ONE commit in both places below: the workflow itself, and tools_ref, which the workflow
# checks out for the skin and packaging tools. Bump both together, and MPC_VST_REF in build.yml with them.
name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version for the zip and INSTALL.md, e.g. 1.0.11
        required: true
        type: string
      dry_run:
        description: Build and package only (zips and skin previews as run artifacts, no draft release)
        type: boolean
        default: false

jobs:
  vst:
    uses: open-mpc/mpc-vst-plugins/.github/workflows/vst-release.yml@0dc17120cd7e952e95eeecdd820ac9e495a75ee9
    permissions: { contents: write }
    with:
      tag: nam-vst-v${{ inputs.version }}
      version: ${{ inputs.version }}
      tools_ref: 0dc17120cd7e952e95eeecdd820ac9e495a75ee9
      vst_dir: vst
      # NAM_VERSION stamps the version into the plugin (scripts/version.py); the checkout has no tags to describe.
      # The skin is built in the MPC OS 2.x shape, which 3.x reads too (vst/gen_skin.sh).
      build: >-
        export NAM_VERSION=${{ inputs.version }} SHADOW_SKIN_MPC_OS=2 &&
        vst/release_build.sh && scripts/check_binary.sh vst/build/nam_vst.so
      # The same checks as ci.yml (its jobs skip themselves when called from a workflow_dispatch run).
      host_test: >-
        python3 scripts/check_params.py && ./vst/build.sh host &&
        g++ -O2 -std=c++17 -Ivst vst/pitch_test.cpp -o vst/build/pitch_test && vst/build/pitch_test
      user_data: models cabs models-removed favorites.txt
      about: "Neural Amp Modeler captures as an MPC insert effect, with cab IR, tone, gate, pitch, delay, reverb and an on-device TONE3000 downloader."
      plugin_id: nam
      license: MIT
      dry_run: ${{ inputs.dry_run }}
