name: Build

# Device build — runs on every push to main and produces the armhf nam_vst.so, its MPC skin and
# the pluginList entry as a downloadable artifact (same payload as scripts/deploy.sh pushes).
# The plugin is compiled for armhf (arm32v7/gcc:11-bullseye, glibc 2.31) and aarch64 under QEMU, exactly as vst/build.sh does locally, and
# the skin is generated with mpc-vst-plugins pinned to the same commit as release.yml.
# Releases are handled by release.yml.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Keep in step with release.yml.
  MPC_VST_REF: f1528a35fbe19ba759957060af6801975977ceca

jobs:
  armhf:
    runs-on: ubuntu-latest
    name: armhf (MPC OS)
    steps:
      - uses: actions/checkout@v7
        with:
          path: port

      - name: Check out mpc-vst-plugins (skin tools)
        uses: actions/checkout@v7
        with:
          repository: open-mpc/mpc-vst-plugins
          ref: ${{ env.MPC_VST_REF }}
          path: mpc-vst-plugins

      - name: Set up QEMU (armhf and aarch64 emulation; release_build.sh builds both)
        uses: docker/setup-qemu-action@v4
        with:
          platforms: arm,arm64

      - name: Install Pillow (skin)
        run: python3 -m pip install --quiet pillow

      - name: Build plugin + skin
        working-directory: port
        env:
          MPC_VST: ${{ github.workspace }}/mpc-vst-plugins
          SHADOW_SKIN_MPC_OS: "2"     # the skin in the MPC OS 2.x shape, which 3.x reads too (vst/gen_skin.sh)
        run: vst/release_build.sh

      - name: Check the binary
        working-directory: port
        run: scripts/check_binary.sh vst/build/nam_vst.so

      - name: Stage payload
        run: |
          STAGE="dist/nam-vst-${GITHUB_SHA::7}-mpc-armv7"
          mkdir -p "$STAGE"
          cp port/vst/build/nam_vst.so port/vst/build/pluginlist-entry.xml "$STAGE/"
          cp -r port/vst/build/skin/* "$STAGE/"
          cp port/README.md port/LICENSE "$STAGE/"
          tar -C dist -czf nam-vst-mpc-armv7.tar.gz "$(basename "$STAGE")"
          A64="dist/nam-vst-${GITHUB_SHA::7}-mpc-aarch64"
          mkdir -p "$A64"
          cp port/vst/build/aarch64/nam_vst.so port/vst/build/pluginlist-entry.xml "$A64/"
          cp -r port/vst/build/skin/* "$A64/"
          cp port/README.md port/LICENSE "$A64/"
          tar -C dist -czf nam-vst-mpc-aarch64.tar.gz "$(basename "$A64")"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: nam-vst-mpc-armv7
          path: nam-vst-mpc-armv7.tar.gz
          if-no-files-found: error
          retention-days: 14

      - name: Upload artifact (aarch64)
        uses: actions/upload-artifact@v7
        with:
          name: nam-vst-mpc-aarch64
          path: nam-vst-mpc-aarch64.tar.gz
          if-no-files-found: error
          retention-days: 14
